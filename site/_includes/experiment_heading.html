{% assign test = include.test %}
  <div class="card-heading"><h2 id="{{ test.id | escape }}-heading">{{ test.title | escape }}</h2><span class="badge">{{ test.id | escape }}</span></div>
  <p>{{ test.items }} items · {{ test.repetitions }} repetitions · {{ test.kind | escape }}{% if test.aggregation %} · {{ test.aggregation }} scoring{% endif %}</p>
