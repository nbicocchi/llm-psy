[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psybench-local"
version = "0.1.0"
description = "Offline-first, incremental questionnaire experiments for local language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
psybench = "psybench.cli:main"

[tool.setuptools.packages.find]
include = ["psybench*"]
